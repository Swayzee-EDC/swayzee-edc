baseURL = "https://onlyswayzee.org/"
title = "Swayzee Economic Development Corporation"
copyright = "Swayzee Economic Development Corporation"
author = "Swayzee EDC"
languageCode = "en"
DefaultContentLanguage = "en"
enableInlineShortcodes = true
theme = "tella"
enableRobotsTXT = true

# Please enable this feature if the site is available in Japanese, Chinese or Korean.
#hasCJKLanguage = true

# If you're using Google Analytics, you can enable this feature.
#googleAnalytics = "UA-12345678-1"

# Disqus Comment System
#disqusShortname = ""

[params]

  showBlog = true
  mainSections = ['news']

  googleFonts = true

  [params.logo]
    main = "images/logo.svg"
    alt = "Swayzee Economic Development Corporation Logo"

    # The size parameter is the class name of tailwindcss
    # https://tailwindcss.com/
    size = "lg:h-24 md:h-24 h-20"
  
  [params.banner]
    enable = false
    text = ""
    url = ""

  [params.footer]
    name = "Swayzee Economic Development Corporation"
    address_line1 = "213 S Washington Street"
    address_line2 = "PO Box 85"
    address_line3 = "Swayzee, IN 46986"
    mission = "Swayzee Economic Development Corporation supports the town of Swayzee, Indiana through economic and community development."
    nonprofit = "A 501(c)(3) nonprofit organization. EIN 93-2894556"

  [params.share]
    enable = true
    services = ["twitter", "facebook", "copy"]

  [params.icon]
    #If you want to use FontAwesome, set this parameter to true.
    fontawesome = true

  [params.homepage_meta_tags]
    meta_description = "The only Swayzee in the world."
    meta_og_title = "Swayzee Economic Development Corporation"
    meta_og_type = "website"
    meta_og_url = "https://onlyswayzee.org/"
    meta_og_image = "https://onlyswayzee.org/images/logo-banner-v1.png"
    meta_og_description = "The only Swayzee in the world."
    meta_twitter_card = "summary_large_image"

[menu]

  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 2

  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 3

  [[menu.main]]
    identifier = "news"
    name = "News"
    url = "/news/"
    weight = 4
  
  [[menu.main]]
    identifier = "calendar"
    name = "Events"
    url = "/calendar/"
    weight = 5

#  [[menu.main]]
#    identifier = "survey"
#    name = "Survey"
#    url = "/community-survey/"
#    weight = 5

  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 6

  # Footer Menu
#  [[menu.footer]]
#    name = "Home"
#    url = "/"
#    pre = "<i class='fa-sharp fa-solid fa-house'></i>"
#      weight = 1

  [[menu.footer]]
    name = "Facebook"
    url = "https://www.facebook.com/onlyswayzee"
    pre = "<i class='fa-brands fa-facebook text-2xl'></i>"
      weight = 2

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'

[module]
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
disableWatch = true
source = "hugo_stats.json"
target = "assets/notwatching/hugo_stats.json"
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "static/images"
target = "static/images"
[[module.mounts]]
source = "assets/images"
target = "static/images"
[[module.mounts]]
source = "assets/images/personnel"
target = "static/images/personnel"
[[module.mounts]]
source = "assets/images/slider"
target = "static/images/slider"